<title id="title">简历修改与交付 · 输入确认完整流程图</title><desc id="desc">权威源简历、批注与目标 修改范围、版式与文件要求；锁定诊断／文本／文件模式 保护原稿、其他方向与版式；正式姓名、唯一目录与权威源简历 必需：改写前唯一；诊断可用给定材料；诊断／文本修改／文件交付及改动范围 必需：决定本轮能做什么；各目标方向／JD、版本用途 条件必需：定向改写前；批注、点名知识库／微信／飞书／附件 条件必需：用户要求结合时必须实际读；受保护版式、经历与目标查看器 条件必需：继承版式或文件交付时；格式、页数、目录、文件数量与清理要求 条件必需：实际文件交付／清理时；先查已有原件与当前记录 保留版本、冲突和缺失；本次模式所需身份、方向与基线明确？；已有来源查不清时 只问影响执行的最小问题；等待关键资料／裁决 暂停依赖步骤；独立工作可继续；进入后续流程 按点名顺序定向读真实来源 登记来源、事实与冲突</desc>
