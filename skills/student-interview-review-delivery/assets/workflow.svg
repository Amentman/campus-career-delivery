<g id="A5" data-node="A5">
<path d="M 345.0 1060 L 620 1115.0 L 345.0 1170 L 70 1115.0 Z" fill="#fff5df" stroke="#b08235" stroke-width="1.5"/>
<text x="345.0" y="1123.4" font-size="24" text-anchor="middle" font-weight="500">A5　原稿与说话人可靠？</text>
</g>
<g id="partial" data-node="partial">
<rect x="700" y="1020" width="240" height="210" fill="#fff3ef" stroke="#b15f4d" stroke-width="1.5"/>
<text x="820.0" y="1076.0" font-size="20" text-anchor="middle" font-weight="400">权限／分页／漏录受阻</text>
<text x="820.0" y="1104.0" font-size="20" text-anchor="middle" font-weight="400">角色不明：不作归因</text>
<text x="820.0" y="1132.0" font-size="20" text-anchor="middle" font-weight="400">保存缺口，标 partial</text>
<text x="820.0" y="1160.0" font-size="20" text-anchor="middle" font-weight="400">可确认片段才进入 B</text>
<text x="820.0" y="1188.0" font-size="20" text-anchor="middle" font-weight="400">无足够文本：等待补充</text>
</g>
<path class="edge" d="M 620 1115 H 700"/>
<text x="660" y="1098" font-size="20" text-anchor="middle" font-weight="400">否</text>
<path class="edge" d="M 345 1170 V 1230"/>
<text x="372" y="1206.0" font-size="20" text-anchor="middle" font-weight="400">是</text>
<g id="toB" data-node="toB">
<rect x="70" y="1230" width="550" height="70" rx="35.0" fill="#edf7f1" stroke="#57836c" stroke-width="1.5"/>
<text x="345.0" y="1272.7" font-size="22" text-anchor="middle" font-weight="500">进入 B：整场／已确认片段</text>
</g>
<path class="edge" d="M 820 1230 V 1265 H 620"/>
<text x="785" y="1296" font-size="20" text-anchor="middle" font-weight="400">有确认片段</text>
<text x="70" y="1345" font-size="20" text-anchor="start" font-weight="400">原稿补齐后返回 A5 重核；接口成功不证明原录音没有漏录。</text>
<path d="M 40 1384 H 960" stroke="#d8e2ed"/>
<text x="40" y="1420" font-size="30" text-anchor="start" font-weight="600">B　保留原始问答，再给具体纠正</text>
<text x="40" y="1456" font-size="22" text-anchor="start" font-weight="400">同句多问与连续追问分别编号；局部任务不扩写范围外题组。</text>
<g id="B1" data-node="B1">
<rect x="70" y="1500" width="550" height="110" fill="white" stroke="#9db1c6" stroke-width="1.5"/>
<text x="345.0" y="1547.3" font-size="22" text-anchor="middle" font-weight="400">逐段核对 T 段，列主问题与连续追问</text>
<text x="345.0" y="1578.1" font-size="22" text-anchor="middle" font-weight="400">反问、事务沟通与排除均写处理理由</text>
</g>
<path class="edge" d="M 345 1610 V 1660"/>
<g id="B2" data-node="B2">
<rect x="70" y="1660" width="550" height="140" fill="white" stroke="#9db1c6" stroke-width="1.5"/>
<text x="345.0" y="1706.9" font-size="22" text-anchor="middle" font-weight="400">按题保留完整原始问答</text>
<text x="345.0" y="1737.7" font-size="22" text-anchor="middle" font-weight="400">原题、原答、追问依次展示，标明来源段</text>
<text x="345.0" y="1768.5" font-size="22" text-anchor="middle" font-weight="400">仅按规则脱敏；转写疑点放在引文外</text>
</g>
<path class="edge" d="M 345 1800 V 1850"/>
<g id="B3" data-node="B3">
<rect x="70" y="1850" width="550" height="140" fill="white" stroke="#9db1c6" stroke-width="1.5"/>
<text x="345.0" y="1896.9" font-size="22" text-anchor="middle" font-weight="400">结合实际 JD、主题与已知面试官职责</text>
<text x="345.0" y="1927.7" font-size="22" text-anchor="middle" font-weight="400">具体点评 → 逻辑 → 完整可口述答案</text>
<text x="345.0" y="1958.5" font-size="22" text-anchor="middle" font-weight="400">相关追问＋完整应对；英语按真实需要</text>
</g>
<path class="edge" d="M 345 1990 V 2040"/>
<g id="B4" data-node="B4">
<rect x="70" y="2040" width="550" height="110" fill="white" stroke="#9db1c6" stroke-width="1.5"/>
<text x="345.0" y="2087.3" font-size="22" text-anchor="middle" font-weight="400">稳定能力须两处独立证据</text>
<text x="345.0" y="2118.1" font-size="22" text-anchor="middle" font-weight="400">选下一轮三项重点任务；简历只给建议</text>
</g>
<path class="edge" d="M 345 2150 V 2200"/>
<g id="B5" data-node="B5">
<path d="M 345.0 2200 L 620 2260.0 L 345.0 2320 L 70 2260.0 Z" fill="#fff5df" stroke="#b08235" stroke-width="1.5"/>
<text x="345.0" y="2251.6" font-size="24" text-anchor="middle" font-weight="500">原稿、索引、原始问答与题卡</text>
<text x="345.0" y="2285.2" font-size="24" text-anchor="middle" font-weight="500">全部对照通过？</text>
</g>
<g id="repair-answer" data-node="repair-answer">
<rect x="700" y="2200" width="240" height="160" fill="#fff3ef" stroke="#b15f4d" stroke-width="1.5"/>
<text x="820.0" y="2245.0" font-size="20" text-anchor="middle" font-weight="400">漏问／删句／顺序失真</text>
<text x="820.0" y="2273.0" font-size="20" text-anchor="middle" font-weight="400">或答案不自然、归因错</text>
<text x="820.0" y="2301.0" font-size="20" text-anchor="middle" font-weight="400">返回对应原文和题卡</text>
<text x="820.0" y="2329.0" font-size="20" text-anchor="middle" font-weight="400">原题号与范围保持不变</text>
