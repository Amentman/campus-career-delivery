<text x="205.0" y="904.5" font-size="20" text-anchor="middle" font-weight="400">本人 CLI 取得并打开</text>
<text x="205.0" y="932.5" font-size="20" text-anchor="middle" font-weight="400">实际逐字稿文件</text>
</g>
