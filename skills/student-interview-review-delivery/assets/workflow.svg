<svg data-artifact-sha256="b12ccd88212f623a142d6c63d34e13367529535ed699e82f5aa32779d1035354" xmlns="http://www.w3.org/2000/svg" width="1000" height="3660" viewBox="0 0 1000 3660" role="img" aria-labelledby="title desc">
<title id="title">真实面试复盘完整流程：输入、原始问答与纠正、交付回读</title>
<desc id="desc">按 A、B、C 三段依次阅读。菱形表示判断，右侧分支写明暂停、返回或停止。完整保留来源分流、范围、异常恢复和受保护页面。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#627d98"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#203852} .edge{fill:none;stroke:#627d98;stroke-width:1.7;marker-end:url(#arrow)} .loop{stroke-dasharray:6 4}</style>
<rect width="1000" height="3660" fill="white"/>
<text x="40" y="62" font-size="36" text-anchor="start" font-weight="650">真实面试复盘</text>
<text x="40" y="106" font-size="22" text-anchor="start" font-weight="400">A 来源与输入 → B 原始问答与纠正 → C 交付与回读</text>
<path d="M 40 164 H 960" stroke="#d8e2ed"/>
<text x="40" y="200" font-size="30" text-anchor="start" font-weight="600">A　先确认对象，再读取原稿</text>
<text x="40" y="236" font-size="22" text-anchor="start" font-weight="400">按箭头向下；右侧写明缺失处理、返回点与停止条件。</text>
<g id="A1" data-node="A1">
<path d="M 345.0 275 L 620 325.0 L 345.0 375 L 70 325.0 Z" fill="#fff5df" stroke="#b08235" stroke-width="1.5"/>
<text x="345.0" y="333.4" font-size="24" text-anchor="middle" font-weight="500">已有真实面试问答？</text>
</g>
<g id="route" data-node="route">
<rect x="700" y="280" width="240" height="100" rx="50.0" fill="#edf7f1" stroke="#57836c" stroke-width="1.5"/>
<text x="820.0" y="309.0" font-size="20" text-anchor="middle" font-weight="500">仅邀约／通用训练</text>
<text x="820.0" y="337.0" font-size="20" text-anchor="middle" font-weight="500">转专岗／模拟流程</text>
<text x="820.0" y="365.0" font-size="20" text-anchor="middle" font-weight="500">在此结束</text>
</g>
<path class="edge" d="M 620 325 H 700"/>
<text x="660" y="308" font-size="20" text-anchor="middle" font-weight="400">否</text>
<path class="edge" d="M 345 375 V 425"/>
<text x="372" y="406.0" font-size="20" text-anchor="middle" font-weight="400">是</text>
<g id="A2" data-node="A2">
<rect x="70" y="425" width="550" height="130" fill="white" stroke="#9db1c6" stroke-width="1.5"/>
<text x="345.0" y="466.9" font-size="22" text-anchor="middle" font-weight="400">A2　核对学生、场次、题组与唯一入口</text>
<text x="345.0" y="497.7" font-size="22" text-anchor="middle" font-weight="400">保护原简历、通用双端及专岗页</text>
<text x="345.0" y="528.5" font-size="22" text-anchor="middle" font-weight="400">查现有记录；冲突只停依赖步骤</text>
</g>
<path class="edge" d="M 345 555 V 605"/>
<g id="A3" data-node="A3">
<path d="M 345.0 605 L 620 655.0 L 345.0 705 L 70 655.0 Z" fill="#fff5df" stroke="#b08235" stroke-width="1.5"/>
<text x="345.0" y="663.4" font-size="24" text-anchor="middle" font-weight="500">必需信息与目标已明确？</text>
</g>
<g id="wait" data-node="wait">
<rect x="700" y="595" width="240" height="155" fill="#fff3ef" stroke="#b15f4d" stroke-width="1.5"/>
<text x="820.0" y="637.5" font-size="20" text-anchor="middle" font-weight="400">缺项／冲突</text>
<text x="820.0" y="665.5" font-size="20" text-anchor="middle" font-weight="400">查原件仍不清才询问</text>
<text x="820.0" y="693.5" font-size="20" text-anchor="middle" font-weight="400">等待时可做独立工作</text>
<text x="820.0" y="721.5" font-size="20" text-anchor="middle" font-weight="400">补齐后回 A2</text>
</g>
<path class="edge" d="M 620 655 H 700"/>
<text x="660" y="638" font-size="20" text-anchor="middle" font-weight="400">否</text>
<path class="edge loop" d="M 820 595 V 575 H 650 V 455 H 620"/>
<text x="682" y="559" font-size="20" text-anchor="middle" font-weight="400">重核</text>
<path class="edge" d="M 345 705 V 760 H 500 V 790"/>
<text x="370" y="738" font-size="20" text-anchor="middle" font-weight="400">是</text>
<path d="M 205 790 H 795" stroke="#627d98" fill="none" stroke-width="1.7"/>
<path class="edge" d="M 205 790 V 825"/>
<path class="edge" d="M 500 790 V 825"/>
<path class="edge" d="M 795 790 V 825"/>
<g id="feishu" data-node="feishu">
