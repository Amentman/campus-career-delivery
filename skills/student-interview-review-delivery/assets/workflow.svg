<text x="500.0" y="876.5" font-size="20" text-anchor="middle" font-weight="400">腾讯会议</text>
<text x="500.0" y="904.5" font-size="20" text-anchor="middle" font-weight="400">后台分页至终态</text>
<text x="500.0" y="932.5" font-size="20" text-anchor="middle" font-weight="400">或本轮完整原生导出</text>
</g>
