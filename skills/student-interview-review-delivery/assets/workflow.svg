<text x="795.0" y="876.5" font-size="20" text-anchor="middle" font-weight="400">本地原稿</text>
<text x="795.0" y="904.5" font-size="20" text-anchor="middle" font-weight="400">保留原件与发言位置</text>
<text x="795.0" y="932.5" font-size="20" text-anchor="middle" font-weight="400">归一化全部文字</text>
</g>
