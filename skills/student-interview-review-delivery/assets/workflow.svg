<path d="M 40 3530 H 960" stroke="#d8e2ed"/>
<text x="40" y="3570" font-size="20" text-anchor="start" font-weight="400">保护原简历、通用双端、专岗页及人工内容；缺配置不改权限或建替代页。</text>
<text x="40" y="3610" font-size="20" text-anchor="start" font-weight="400">返回仅处理本轮对应原文、题卡或回读，不扩大修改范围。</text>
</svg>
