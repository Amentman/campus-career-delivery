<text x="820.0" y="3433.0" font-size="20" text-anchor="middle" font-weight="400">保留具体未验项</text>
<text x="820.0" y="3461.0" font-size="20" text-anchor="middle" font-weight="400">停止依赖步骤</text>
</g>
<path class="edge" d="M 345 3270 V 3370"/>
<text x="372" y="3326.0" font-size="20" text-anchor="middle" font-weight="400">是</text>
<g id="done" data-node="done">
<rect x="70" y="3370" width="550" height="110" rx="55.0" fill="#edf7f1" stroke="#57836c" stroke-width="1.5"/>
<text x="345.0" y="3417.3" font-size="22" text-anchor="middle" font-weight="500">交付唯一链接、复盘正文与训练任务</text>
<text x="345.0" y="3448.1" font-size="22" text-anchor="middle" font-weight="500">分别报告原稿覆盖、文档验收及待处理项</text>
