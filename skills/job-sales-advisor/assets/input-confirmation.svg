<title id="title">求职咨询与销售跟进 · 输入确认完整流程图</title><desc id="desc">客户原话、背景与当前问题 本次交付对象和产品资料；本次要求什么交付？；先读客户原话和已定交付对象 检索本成员知识库及当前产品口径；客户原话与当前要解决的问题 必需：真实材料或短背景；顾问参考／对客短稿／正式规划 必需：按交付对象分流；阶段、背景、岗位城市及约束 条件：影响销售诊断时；本人知识库索引与相关依据 条件：可访问时必须检索；当前产品、价格与合同口径 条件：涉及报价承诺时；案例公开范围与真实结果状态 条件：使用案例和卖点时；本轮必需信息已明确？ 条件项只在适用时检查；只问会改变回复的事实 价格冲突先核当前确认来源；等待相关事实的补充 已有依据的短稿仍可先交；进入后续流程 正式学生规划／作品集设计 转对应 Skill，不用销售卡替代；进入后续流程 定位当前成员知识库 读取实际索引、提炼层检索词</desc>
